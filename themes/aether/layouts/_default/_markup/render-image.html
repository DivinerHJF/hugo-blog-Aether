{{- $options := dict "Src" .Destination "Alt" .Text "Title" .Title "Caption" .Title "ContentImage" true "Resources" .Page.Resources -}}
{{- if .Title -}}
    <figure class="content-image">
        {{- partial "plugin/image.html" $options -}}
        <figcaption class="image-caption">
            {{- .Title | safeHTML -}}
        </figcaption>
    </figure>
{{- else -}}
    {{- partial "plugin/image.html" $options -}}
{{- end -}}
